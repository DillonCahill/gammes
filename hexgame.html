<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex-to-Color Matcher</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            text-align: center;
            width: 480px;
        }

        /* The target hex code display */
        #target-hex {
            font-family: 'Courier New', Courier, monospace;
            font-size: 3rem;
            font-weight: 800;
            margin: 1rem 0;
            letter-spacing: 2px;
            color: #334155;
        }

        .controls {
            margin-bottom: 2rem;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
        }

        /* Grid of color swatches */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        .swatch {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            cursor: pointer;
            border: 4px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .swatch:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        .swatch:active {
            transform: scale(0.95);
        }

        .status {
            height: 30px;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid #edf2f7;
            padding-top: 1rem;
        }

        input[type=range] {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3 style="margin:0; color: #64748b; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Find this color:</h3>
    <div id="target-hex">#000000</div>

    <div class="controls">
        <label>Difficulty: <span id="diff-val">4</span> Colors</label>
        <input type="range" id="difficulty" min="2" max="12" value="4">
    </div>
    
    <div id="color-grid" class="color-grid"></div>

    <div id="message" class="status"></div>

    <div class="score-row">
        <span>Current Streak: <b id="score" style="color:var(--text-main)">0</b></span>
        <span>All-Time Best: <b id="best" style="color:var(--text-main)">0</b></span>
    </div>
</div>

<script>
    const targetHexDisplay = document.getElementById('target-hex');
    const colorGrid = document.getElementById('color-grid');
    const messageDisplay = document.getElementById('message');
    const scoreDisplay = document.getElementById('score');
    const bestDisplay = document.getElementById('best');
    const diffSlider = document.getElementById('difficulty');
    const diffVal = document.getElementById('diff-val');

    let score = 0;
    let highScore = 0;
    let correctAnswer = "";
    let numColors = 4;

    function generateRandomHex() {
        const hex = Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase();
        return "#" + hex;
    }

    function initGame() {
        colorGrid.innerHTML = "";
        messageDisplay.textContent = "";
        
        // Pick the winning color
        correctAnswer = generateRandomHex();
        targetHexDisplay.textContent = correctAnswer;

        // Generate pool of colors
        let colors = [correctAnswer];
        while (colors.length < numColors) {
            let col = generateRandomHex();
            if (!colors.includes(col)) colors.push(col);
        }

        // Shuffle colors
        colors.sort(() => Math.random() - 0.5);

        // Create the clickable swatches
        colors.forEach(hex => {
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.style.backgroundColor = hex;
            swatch.onclick = () => checkAnswer(hex);
            colorGrid.appendChild(swatch);
        });
    }

    function checkAnswer(selected) {
        if (selected === correctAnswer) {
            score++;
            messageDisplay.style.color = "#10b981";
            messageDisplay.textContent = "Perfect Match!";
            if (score > highScore) highScore = score;
            updateUI();
            setTimeout(initGame, 800);
        } else {
            score = 0;
            messageDisplay.style.color = "#ef4444";
            messageDisplay.textContent = "Wrong color! Starting over.";
            updateUI();
            setTimeout(initGame, 1500);
        }
    }

    function updateUI() {
        scoreDisplay.textContent = score;
        bestDisplay.textContent = highScore;
    }

    diffSlider.oninput = function() {
        numColors = parseInt(this.value);
        diffVal.textContent = numColors;
        score = 0; 
        updateUI();
        initGame();
    };

    // Start
    initGame();
</script>

</body>
</html>
